<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SaborExpress — Login</title>
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>🍽️ SaborExpress</h1>
      <div class="sub">Order Management System</div>

      <div id="error" class="error-msg"></div>

      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="user@saborexpress.com" required autofocus />

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required />

        <label style="display:flex;align-items:center;gap:8px;font-weight:400;color:#212529">
          <input type="checkbox" id="remember" style="width:auto;margin:0" /> Remember session (7 days)
        </label>

        <button type="submit" id="btnLogin" style="width:100%">Log in</button>
      </form>

      <div class="hint">
        <strong>Demo accounts:</strong><br />
        admin@saborexpress.com / Admin@123<br />
        mesero@saborexpress.com / Mesero@123<br />
        cajero@saborexpress.com / Cajero@123
      </div>
    </div>
  </div>

  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/services/auth.service.js"></script>
  <script>
    if (new URLSearchParams(location.search).get('expired')) {
      const e = document.getElementById('error');
      e.textContent = 'Session expired due to inactivity.';
      e.style.display = 'block';
    }

    document.getElementById('loginForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById('error');
      const btn = document.getElementById('btnLogin');
      errorBox.style.display = 'none';
      btn.disabled = true; btn.textContent = 'Signing in…';
      try {
        const data = await AuthService.login(
          document.getElementById('email').value.trim(),
          document.getElementById('password').value,
          document.getElementById('remember').checked
        );
        const home = { Mesero: '/take-order.html', Cajero: '/close-and-pay.html', Administrador: '/admin.html' };
        window.location.href = home[data.role] || '/index.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
